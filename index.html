<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PetCare Management System</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand"><div class="brand-icon">🐾</div><div><b>PetCare</b><small>Management System</small></div></div>
    <nav id="nav">
      <button class="nav-item active" data-page="dashboard">🏠 <span>Dashboard</span></button>
      <button class="nav-item" data-page="pets">🐶 <span>Pet Records</span></button>
      <button class="nav-item" data-page="owners">👤 <span>Owners</span></button>
      <button class="nav-item" data-page="breeds">🧬 <span>Breeds</span></button>
      <div class="nav-label">CLINIC</div>
      <button class="nav-item" data-page="consultations">🩺 <span>Consultations</span></button>
      <button class="nav-item" data-page="appointments">📅 <span>Appointments</span></button>
      <button class="nav-item" data-page="services">✂️ <span>Services</span></button>
      <button class="nav-item" data-page="medicines">💊 <span>Medicines</span></button>
      <div class="nav-label">FINANCE</div>
      <button class="nav-item" data-page="charges">🧾 <span>Clinic Charges & Billing</span></button>
      <button class="nav-item" data-page="payments">💳 <span>Payments</span></button>
      <button class="nav-item" data-page="reports">📊 <span>Reports</span></button>
      <button class="nav-item" data-page="search">🔎 <span>Search</span></button>
      <div class="nav-label">SYSTEM</div>
      <button class="nav-item" data-page="backup">💾 <span>Backup & Restore</span></button>
      <button class="nav-item" data-page="settings">⚙️ <span>Settings</span></button>
    </nav>
    <div class="sidebar-foot">LocalStorage app<br><span id="saveState">Saved locally</span></div>
  </aside>

  <main class="main">
    <header class="topbar">
      <button class="menu-btn" id="menuBtn">☰</button>
      <div class="quick-search">
        <span>🔎</span><input id="globalSearch" placeholder="Search pet, owner, ID, phone, or microchip...">
        <div id="searchDrop" class="search-drop hidden"></div>
      </div>
      <div class="top-actions"><span id="clock"></span><button class="icon-btn" onclick="showPage('backup')">💾</button></div>
    </header>
    <section class="content" id="content"></section>
  </main>
</div>

<div id="modal" class="modal hidden"><div class="modal-card" id="modalCard"></div></div>
<div id="toastBox"></div>

<script src="script.js"></script>
</body>
</html>
